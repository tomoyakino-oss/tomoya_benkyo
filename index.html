<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>うちゅうせんパニック</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #1e1b4b;
            color: white;
            touch-action: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-canvas {
            background-color: #312e81;
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* スマホ向け 十字キーサイズ */
        .dpad-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            touch-action: none;
        }
        /* PC向け 十字キーサイズ */
        @media (min-width: 768px) {
            .dpad-btn {
                border-radius: 16px;
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 24, 39, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            overflow-y: auto; /* 画面が小さい時はスクロール可能に */
            padding: 20px 0;
        }
        .hidden-screen { display: none !important; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- UIレイヤー (プレイ中) -->
    <div id="ui-layer" class="hidden-screen absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/50 px-4 py-2 rounded-full font-bold text-sm md:text-base whitespace-nowrap">
            あなたは: <span id="my-role-text">クルー 👨‍🚀</span>
        </div>
        
        <!-- 左下: 十字キー -->
        <div class="absolute bottom-4 left-4 md:bottom-8 md:left-8 pointer-events-auto flex flex-col items-center gap-1 md:gap-2">
            <button class="dpad-btn" id="btn-up">🔼</button>
            <div class="flex gap-1 md:gap-2">
                <button class="dpad-btn" id="btn-left">◀️</button>
                <div class="w-[50px] md:w-[60px]"></div>
                <button class="dpad-btn" id="btn-right">▶️</button>
            </div>
            <button class="dpad-btn" id="btn-down">🔽</button>
        </div>
        
        <!-- 右下: アクションボタン -->
        <div class="absolute bottom-4 right-4 md:bottom-8 md:right-8 pointer-events-auto flex flex-col items-end gap-2 md:gap-4">
            <button id="btn-catch" class="hidden bg-red-600 border-4 border-red-800 text-white font-bold py-3 px-4 md:py-4 md:px-6 rounded-full shadow-lg text-sm md:text-xl transform transition active:scale-95">
                👾 つかまえる
            </button>
            <button id="btn-meeting" class="bg-yellow-400 border-4 border-yellow-600 text-black font-bold py-3 px-4 md:py-4 md:px-6 rounded-full shadow-lg text-sm md:text-xl transform transition active:scale-95">
                🚨 きんきゅうかいぎ
            </button>
        </div>
    </div>

    <!-- 最初の参加・モード選択画面 -->
    <div id="join-screen" class="screen-overlay">
        <div class="bg-indigo-900 p-6 md:p-8 rounded-3xl border-4 border-indigo-500 shadow-2xl text-center max-w-sm w-[90%] my-auto flex-shrink-0">
            <h1 class="text-2xl md:text-3xl font-bold text-yellow-300 mb-4 flex flex-col items-center">
                <span class="text-4xl md:text-5xl mb-2">🚀</span>うちゅうせんパニック
            </h1>
            <input type="text" id="player-name-input" placeholder="なまえをいれてね" maxlength="8"
                   class="w-full text-black px-4 py-2 md:py-3 rounded-xl text-lg md:text-xl font-bold mb-4 text-center focus:outline-none focus:ring-4 focus:ring-yellow-400">
            <div class="mb-4 flex justify-center gap-2 flex-wrap" id="color-picker"></div>
            
            <hr class="my-4 md:my-6 border-indigo-500">
            
            <!-- ひとりで遊ぶ -->
            <div class="mb-4">
                <p class="text-white font-bold mb-2 text-sm md:text-base">🤖 ひとりで遊ぶ（CPU対戦）</p>
                <div class="flex justify-center gap-2 mb-2">
                    <label class="text-xs md:text-sm"><input type="radio" name="cpu-level" value="easy" checked> やさしい</label>
                    <label class="text-xs md:text-sm"><input type="radio" name="cpu-level" value="normal"> ふつう</label>
                    <label class="text-xs md:text-sm"><input type="radio" name="cpu-level" value="hard"> むずかしい</label>
                </div>
                <button id="btn-solo" class="w-full bg-orange-500 hover:bg-orange-400 border-b-4 border-orange-700 text-white font-bold py-2 md:py-3 px-4 md:px-6 rounded-xl text-lg md:text-xl transition-all">
                    ひとりで遊ぶ
                </button>
            </div>
            
            <hr class="my-4 md:my-6 border-indigo-500">
            
            <!-- みんなで遊ぶ -->
            <div>
                <p class="text-white font-bold mb-2 text-sm md:text-base">🌐 みんなで遊ぶ（オンライン）</p>
                <input type="text" id="room-password-input" placeholder="合言葉（パスワード）" maxlength="15"
                       class="w-full text-black px-4 py-2 md:py-3 rounded-xl text-lg md:text-xl font-bold mb-4 text-center focus:outline-none focus:ring-4 focus:ring-yellow-400">
                <button id="btn-multi" class="w-full bg-green-500 hover:bg-green-400 border-b-4 border-green-700 text-white font-bold py-2 md:py-3 px-4 md:px-6 rounded-xl text-lg md:text-xl transition-all">
                    みんなで遊ぶ
                </button>
            </div>
        </div>
    </div>

    <!-- マルチプレイ用 ロビー待機画面 -->
    <div id="wait-screen" class="screen-overlay hidden-screen">
        <div class="bg-indigo-900 p-6 md:p-8 rounded-3xl border-4 border-indigo-500 shadow-2xl text-center max-w-sm w-[90%] flex flex-col h-[70vh] my-auto flex-shrink-0">
            <h2 class="text-xl md:text-2xl font-bold text-white mb-4">ロビー</h2>
            <div class="flex-grow bg-indigo-950 rounded-xl p-4 overflow-y-auto no-scrollbar mb-4">
                <ul id="lobby-player-list" class="space-y-2 text-base md:text-lg"></ul>
            </div>
            <p class="text-yellow-300 mb-4 font-bold text-sm md:text-base" id="lobby-status">みんなをまっています...</p>
            <button id="btn-start-multi" class="w-full bg-blue-500 hover:bg-blue-400 border-b-4 border-blue-700 text-white font-bold py-3 px-6 rounded-xl text-lg md:text-xl transition-all">
                ゲームスタート！
            </button>
        </div>
    </div>

    <!-- 役職発表画面 -->
    <div id="role-screen" class="screen-overlay hidden-screen justify-center items-center">
        <div class="text-center animate-bounce">
            <h2 id="role-title" class="text-4xl md:text-5xl font-bold mb-4"></h2>
            <p id="role-desc" class="text-lg md:text-xl"></p>
        </div>
    </div>

    <!-- 会議画面 -->
    <div id="meeting-screen" class="screen-overlay hidden-screen">
        <div class="bg-indigo-900 p-4 rounded-3xl border-4 border-yellow-500 shadow-2xl max-w-md w-[95%] h-[85vh] md:h-[80vh] flex flex-col my-auto flex-shrink-0">
            <h2 class="text-xl md:text-2xl font-bold text-center text-yellow-400 mb-2">🚨 きんきゅうかいぎ 🚨</h2>
            <p class="text-center text-xs md:text-sm mb-4" id="meeting-desc">エイリアンはだれだ！？</p>
            <div id="chat-messages" class="flex-grow bg-indigo-950 rounded-xl p-4 overflow-y-auto no-scrollbar mb-4 flex flex-col gap-2"></div>
            <div class="flex gap-2 mb-4 shrink-0">
                <input type="text" id="chat-input" placeholder="メッセージ..." maxlength="30" class="flex-grow text-black px-4 py-2 rounded-xl text-base md:text-lg focus:outline-none">
                <button id="btn-send-chat" class="bg-green-500 text-white font-bold py-2 px-4 rounded-xl text-sm md:text-base">そうしん</button>
            </div>
            <button id="btn-end-meeting" class="w-full bg-red-500 hover:bg-red-400 border-b-4 border-red-700 text-white font-bold py-3 px-6 rounded-xl text-base md:text-lg transition-all shrink-0">
                かいぎをおわる
            </button>
        </div>
    </div>

    <!-- アラート -->
    <div id="alert-modal" class="screen-overlay hidden-screen z-[100]">
        <div class="bg-gray-800 p-6 rounded-2xl border-2 border-gray-600 text-center max-w-xs my-auto">
            <p id="alert-text" class="text-base md:text-lg font-bold mb-4"></p>
            <button id="btn-alert-ok" class="bg-blue-500 text-white font-bold py-2 px-6 rounded-xl">OK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2vkuVnAT-MLUUaUlNOswabp5mbUC-teU",
            authDomain: "amogmane-91e39.firebaseapp.com",
            databaseURL: "https://amogmane-91e39-default-rtdb.firebaseio.com",
            projectId: "amogmane-91e39",
            storageBucket: "amogmane-91e39.firebasestorage.app",
            messagingSenderId: "904044254664",
            appId: "1:904044254664:web:e37381dcfa299ec09c9cfd",
            measurementId: "G-0HL24WP5ML"
        };

        const appId = 'spaceship-panic';
        let auth, db, userId, currentRoomId;
        
        let me = { name: '', color: '#ef4444', x: 500, y: 500, isAlive: true, role: 'crew' };
        let players = {};
        let globalState = { status: 'lobby', alienId: null, meetingCaller: null };
        let gameMode = 'multi'; 
        
        let cpuLevel = 'easy';
        let cpuTimer = null;
        let cpuData = []; 

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const MAP_SIZE = 2000;
        let dx = 0, dy = 0;
        const speed = 5;
        let lastSyncTime = 0;
        let animationFrameId;

        const colors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#ec4899', '#a855f7', '#f97316', '#ffffff'];
        const colorPicker = document.getElementById('color-picker');
        colors.forEach(color => {
            const btn = document.createElement('button');
            btn.className = `w-8 h-8 rounded-full border-2 ${color === me.color ? 'border-white' : 'border-transparent'}`;
            btn.style.backgroundColor = color;
            btn.onclick = () => {
                me.color = color;
                Array.from(colorPicker.children).forEach(c => c.classList.remove('border-white'));
                btn.classList.add('border-white');
            };
            colorPicker.appendChild(btn);
        });

        function showAlert(msg) {
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden-screen');
        }
        document.getElementById('btn-alert-ok').onclick = () => {
            document.getElementById('alert-modal').classList.add('hidden-screen');
        };
        
        function switchScreen(screenId) {
            ['join-screen', 'wait-screen', 'role-screen', 'meeting-screen', 'ui-layer'].forEach(id => {
                document.getElementById(id).classList.add('hidden-screen');
            });
            if(screenId) document.getElementById(screenId).classList.remove('hidden-screen');
        }

        async function initGame() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                const cred = await signInAnonymously(auth);
                userId = cred.user.uid;
                
                document.getElementById('btn-multi').onclick = joinMultiGame;
                document.getElementById('btn-solo').onclick = startSoloGame;
                document.getElementById('btn-start-multi').onclick = startFirebaseGame;
                document.getElementById('btn-meeting').onclick = callMeeting;
                document.getElementById('btn-end-meeting').onclick = endMeeting;
                document.getElementById('btn-send-chat').onclick = sendChat;
                document.getElementById('btn-catch').onclick = catchCrew;
                setupDPad();

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                requestAnimationFrame(gameLoop);
            } catch (error) {
                console.error(error);
                showAlert('せつぞくにシッパイしました: ' + error.message);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        /* -------------------------------------------
           オンライン マルチプレイ機能
        ------------------------------------------- */
        async function joinMultiGame() {
            gameMode = 'multi';
            const nameInput = document.getElementById('player-name-input').value.trim();
            const passwordInput = document.getElementById('room-password-input').value.trim();

            if (!nameInput) { showAlert('なまえをいれてね！'); return; }
            if (!passwordInput) { showAlert('合言葉（パスワード）をいれてね！'); return; }

            currentRoomId = passwordInput;
            me.name = nameInput;
            me.x = Math.random() * (MAP_SIZE - 200) + 100;
            me.y = Math.random() * (MAP_SIZE - 200) + 100;

            switchScreen('wait-screen');

            const playerRef = doc(db, 'artifacts', appId, 'public', 'data', `players_${currentRoomId}`, userId);
            await setDoc(playerRef, {
                name: me.name, color: me.color, x: me.x, y: me.y, isAlive: true, role: 'crew', lastActive: Date.now()
            });
            startListening();
        }

        function startListening() {
            const globalRef = doc(db, 'artifacts', appId, 'public', 'data', `globalState_${currentRoomId}`, 'main');
            onSnapshot(globalRef, (docSnap) => {
                if (docSnap.exists()) {
                    const newState = docSnap.data();
                    handleStateChange(globalState.status, newState.status, newState);
                    globalState = newState;
                }
            });

            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', `players_${currentRoomId}`);
            onSnapshot(playersCol, (snapshot) => {
                const newPlayers = {};
                snapshot.forEach(doc => { newPlayers[doc.id] = doc.data(); });
                players = newPlayers;
                updateLobbyList();
                
                if (players[userId]) {
                    me.isAlive = players[userId].isAlive;
                    me.role = players[userId].role;
                    if (globalState.status === 'playing') {
                        document.getElementById('btn-catch').style.display = (me.role === 'alien' && me.isAlive) ? 'block' : 'none';
                    }
                }
            });

            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `chats_${currentRoomId}`);
            onSnapshot(chatCol, (snapshot) => {
                const chatBox = document.getElementById('chat-messages');
                chatBox.innerHTML = '';
                const msgs = [];
                snapshot.forEach(doc => msgs.push(doc.data()));
                msgs.sort((a, b) => a.timestamp - b.timestamp);
                
                msgs.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `p-2 rounded-lg text-black ${msg.senderId === userId ? 'bg-green-200 self-end' : 'bg-gray-100 self-start'} max-w-[80%]`;
                    div.innerHTML = `<span class="font-bold text-xs text-gray-500 block">${msg.senderName}</span>${msg.text}`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function updateLobbyList() {
            if (globalState.status !== 'lobby') return;
            const list = document.getElementById('lobby-player-list');
            list.innerHTML = '';
            Object.values(players).forEach(p => {
                const li = document.createElement('li');
                li.className = "flex items-center gap-2";
                li.innerHTML = `<span class="w-4 h-4 rounded-full inline-block" style="background-color: ${p.color}"></span> ${p.name}`;
                list.appendChild(li);
            });
        }

        async function startFirebaseGame() {
            const playerIds = Object.keys(players);
            if (playerIds.length < 2) { showAlert('2人いじょうであそんでね！'); return; }
            const alienId = playerIds[Math.floor(Math.random() * playerIds.length)];

            for (let pid of playerIds) {
                const pRef = doc(db, 'artifacts', appId, 'public', 'data', `players_${currentRoomId}`, pid);
                await updateDoc(pRef, { 
                    role: pid === alienId ? 'alien' : 'crew',
                    isAlive: true, x: Math.random() * (MAP_SIZE - 200) + 100, y: Math.random() * (MAP_SIZE - 200) + 100
                });
            }

            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `chats_${currentRoomId}`);
            const chatDocs = await getDocs(chatCol);
            chatDocs.forEach(d => deleteDoc(d.ref));

            const globalRef = doc(db, 'artifacts', appId, 'public', 'data', `globalState_${currentRoomId}`, 'main');
            await setDoc(globalRef, { status: 'playing', alienId: alienId, meetingCaller: null });
        }


        /* -------------------------------------------
           ひとりで遊ぶ（CPU対戦）機能
        ------------------------------------------- */
        function startSoloGame() {
            gameMode = 'solo';
            const nameInput = document.getElementById('player-name-input').value.trim();
            if (!nameInput) { showAlert('なまえをいれてね！'); return; }
            
            const diffRadios = document.getElementsByName('cpu-level');
            for(let r of diffRadios){ if(r.checked) cpuLevel = r.value; }

            me.name = nameInput;
            me.x = Math.random() * (MAP_SIZE - 200) + 100;
            me.y = Math.random() * (MAP_SIZE - 200) + 100;
            me.isAlive = true;

            const botNames = ['ロボット1号', 'ロボット2号', 'ロボット3号'];
            const botColors = ['#3b82f6', '#22c55e', '#eab308'].filter(c => c !== me.color);
            players = {};
            players[userId] = me;

            cpuData = [];
            for (let i=0; i<3; i++) {
                const bId = 'bot_' + i;
                const bx = Math.random() * (MAP_SIZE - 200) + 100;
                const by = Math.random() * (MAP_SIZE - 200) + 100;
                players[bId] = { name: botNames[i], color: botColors[i] || '#ffffff', x: bx, y: by, isAlive: true, role: 'crew' };
                cpuData.push({ id: bId, targetX: bx, targetY: by, speed: 2 });
            }

            const allIds = Object.keys(players);
            const alienId = allIds[Math.floor(Math.random() * allIds.length)];
            allIds.forEach(id => players[id].role = (id === alienId) ? 'alien' : 'crew');
            me.role = players[userId].role;

            globalState.status = 'playing';
            globalState.alienId = alienId;
            
            document.getElementById('btn-catch').style.display = (me.role === 'alien') ? 'block' : 'none';

            handleStateChange('lobby', 'playing', globalState);
            startCPUAI();
        }

        function startCPUAI() {
            if (cpuTimer) clearInterval(cpuTimer);
            let aiSpeed = 2; let moveInterval = 1500; let catchDist = 80;
            if (cpuLevel === 'normal') { aiSpeed = 3; moveInterval = 1000; catchDist = 120; }
            if (cpuLevel === 'hard') { aiSpeed = 4.5; moveInterval = 500; catchDist = 180; }

            cpuTimer = setInterval(() => {
                if (globalState.status !== 'playing') return;
                cpuData.forEach(cpu => {
                    const p = players[cpu.id];
                    if (!p || !p.isAlive) return;

                    if (p.role === 'alien') {
                        let closestCrew = null; let minDist = 9999;
                        Object.keys(players).forEach(tgtId => {
                            const tgt = players[tgtId];
                            if (tgtId !== cpu.id && tgt.isAlive && tgt.role === 'crew') {
                                const d = Math.hypot(p.x - tgt.x, p.y - tgt.y);
                                if (d < minDist) { minDist = d; closestCrew = tgt; }
                            }
                        });

                        if (closestCrew) {
                            if (cpuLevel === 'hard' || (cpuLevel === 'normal' && Math.random() < 0.7)) {
                                cpu.targetX = closestCrew.x; cpu.targetY = closestCrew.y;
                            } else {
                                cpu.targetX = p.x + (Math.random() - 0.5) * 500; cpu.targetY = p.y + (Math.random() - 0.5) * 500;
                            }
                            if (minDist < catchDist) {
                                closestCrew.isAlive = false;
                                if (closestCrew === me) me.isAlive = false;
                            }
                        }
                    } else {
                        let alienDist = 9999; let alienObj = null;
                        if (players[globalState.alienId]) {
                            alienObj = players[globalState.alienId];
                            alienDist = Math.hypot(p.x - alienObj.x, p.y - alienObj.y);
                        }
                        if (cpuLevel !== 'easy' && alienDist < 300) {
                            cpu.targetX = p.x + (p.x - alienObj.x); cpu.targetY = p.y + (p.y - alienObj.y);
                        } else {
                            cpu.targetX = p.x + (Math.random() - 0.5) * 800; cpu.targetY = p.y + (Math.random() - 0.5) * 800;
                        }
                    }
                    cpu.targetX = Math.max(50, Math.min(MAP_SIZE - 50, cpu.targetX));
                    cpu.targetY = Math.max(50, Math.min(MAP_SIZE - 50, cpu.targetY));
                    cpu.speed = aiSpeed;
                });
            }, moveInterval);
        }

        function updateCPUMovement() {
            if (globalState.status !== 'playing') return;
            cpuData.forEach(cpu => {
                const p = players[cpu.id];
                if (!p || !p.isAlive) return;
                const dx = cpu.targetX - p.x; const dy = cpu.targetY - p.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 5) { p.x += (dx / dist) * cpu.speed; p.y += (dy / dist) * cpu.speed; }
            });
        }


        /* -------------------------------------------
           共通アクション処理
        ------------------------------------------- */
        function handleStateChange(oldStatus, newStatus, stateData) {
            if (oldStatus === newStatus) return;

            if (newStatus === 'playing') {
                switchScreen('role-screen');
                const title = document.getElementById('role-title');
                const desc = document.getElementById('role-desc');
                
                setTimeout(() => {
                    if (me.role === 'alien') {
                        title.innerText = "あなたは エイリアン 👾";
                        title.className = "text-4xl md:text-5xl font-bold mb-4 text-red-500";
                        desc.innerText = "クルーにバレずにつかまえろ！";
                    } else {
                        title.innerText = "あなたは クルー 👨‍🚀";
                        title.className = "text-4xl md:text-5xl font-bold mb-4 text-blue-400";
                        desc.innerText = "エイリアンからにげろ！";
                    }
                    document.getElementById('my-role-text').innerText = me.role === 'alien' ? 'エイリアン 👾' : 'クルー 👨‍🚀';
                    
                    setTimeout(() => {
                        if(globalState.status === 'playing') switchScreen('ui-layer');
                    }, 3000);
                }, 500);

            } else if (newStatus === 'meeting') {
                document.getElementById('meeting-desc').innerText = `🚨 ${globalState.meetingCaller} がかいぎをひらきました！`;
                if(gameMode === 'solo') {
                    document.getElementById('chat-messages').innerHTML = '<div class="text-center text-gray-400 text-sm mt-4">CPU対戦ではチャットはできません</div>';
                }
                switchScreen('meeting-screen');
            } else if (newStatus === 'lobby') {
                switchScreen('wait-screen');
            }
        }

        async function catchCrew() {
            if (me.role !== 'alien' || !me.isAlive) return;
            let closestId = null; let minDistance = 150;
            Object.entries(players).forEach(([id, p]) => {
                if (id !== userId && p.isAlive && p.role === 'crew') {
                    const dist = Math.hypot(me.x - p.x, me.y - p.y);
                    if (dist < minDistance) { minDistance = dist; closestId = id; }
                }
            });

            if (closestId) {
                if (gameMode === 'multi') {
                    const pRef = doc(db, 'artifacts', appId, 'public', 'data', `players_${currentRoomId}`, closestId);
                    await updateDoc(pRef, { isAlive: false });
                } else {
                    players[closestId].isAlive = false;
                }
                const btn = document.getElementById('btn-catch');
                btn.style.display = 'none';
                setTimeout(() => { if(me.isAlive && globalState.status === 'playing') btn.style.display = 'block'; }, 3000);
            }
        }

        async function callMeeting() {
            if (!me.isAlive) return;
            if (gameMode === 'multi') {
                const globalRef = doc(db, 'artifacts', appId, 'public', 'data', `globalState_${currentRoomId}`, 'main');
                await updateDoc(globalRef, { status: 'meeting', meetingCaller: me.name });
            } else {
                globalState.status = 'meeting'; globalState.meetingCaller = me.name;
                handleStateChange('playing', 'meeting', globalState);
            }
        }

        async function endMeeting() {
            if (gameMode === 'multi') {
                const globalRef = doc(db, 'artifacts', appId, 'public', 'data', `globalState_${currentRoomId}`, 'main');
                await updateDoc(globalRef, { status: 'playing' });
            } else {
                globalState.status = 'playing';
                handleStateChange('meeting', 'playing', globalState);
            }
        }

        async function sendChat() {
            if (gameMode === 'solo') { showAlert('CPU対戦ではチャットはできません'); return; }
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `chats_${currentRoomId}`);
            await addDoc(chatCol, { senderId: userId, senderName: me.name, text: text, timestamp: Date.now() });
            input.value = '';
        }

        /* -------------------------------------------
           描画・操作系
        ------------------------------------------- */
        function setupDPad() {
            // 画面の十字キー（スマホ/マウス用）
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            const startMove = (dirX, dirY) => (e) => { e.preventDefault(); dx = dirX; dy = dirY; };
            const stopMove = (e) => { e.preventDefault(); dx = 0; dy = 0; };

            btnUp.addEventListener('touchstart', startMove(0, -1), {passive: false}); btnUp.addEventListener('mousedown', startMove(0, -1));
            btnDown.addEventListener('touchstart', startMove(0, 1), {passive: false}); btnDown.addEventListener('mousedown', startMove(0, 1));
            btnLeft.addEventListener('touchstart', startMove(-1, 0), {passive: false}); btnLeft.addEventListener('mousedown', startMove(-1, 0));
            btnRight.addEventListener('touchstart', startMove(1, 0), {passive: false}); btnRight.addEventListener('mousedown', startMove(1, 0));

            const endEvents = ['touchend', 'touchcancel', 'mouseup', 'mouseleave'];
            endEvents.forEach(evt => {
                btnUp.addEventListener(evt, stopMove); btnDown.addEventListener(evt, stopMove);
                btnLeft.addEventListener(evt, stopMove); btnRight.addEventListener(evt, stopMove);
            });

            // PC用キーボード操作 (WASD / 矢印キー) の追加
            window.addEventListener('keydown', (e) => {
                // チャット入力中は動かさない
                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                
                if (['ArrowUp', 'w', 'W'].includes(e.key)) { dx = 0; dy = -1; }
                if (['ArrowDown', 's', 'S'].includes(e.key)) { dx = 0; dy = 1; }
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) { dx = -1; dy = 0; }
                if (['ArrowRight', 'd', 'D'].includes(e.key)) { dx = 1; dy = 0; }
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'w', 'W', 'ArrowDown', 's', 'S', 'ArrowLeft', 'a', 'A', 'ArrowRight', 'd', 'D'].includes(e.key)) {
                    dx = 0; dy = 0;
                }
            });
        }

        async function gameLoop() {
            if (globalState.status === 'playing' && me.isAlive) {
                if (dx !== 0 || dy !== 0) {
                    me.x = Math.max(20, Math.min(MAP_SIZE - 20, me.x + dx * speed));
                    me.y = Math.max(20, Math.min(MAP_SIZE - 20, me.y + dy * speed));
                }

                if (gameMode === 'multi') {
                    const now = Date.now();
                    if (now - lastSyncTime > 100 && (dx !== 0 || dy !== 0)) {
                        lastSyncTime = now;
                        try {
                            const pRef = doc(db, 'artifacts', appId, 'public', 'data', `players_${currentRoomId}`, userId);
                            await updateDoc(pRef, { x: me.x, y: me.y, lastActive: now });
                        } catch(e) {}
                    }
                } else if (gameMode === 'solo') {
                    updateCPUMovement();
                }
            }
            drawCanvas();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (globalState.status !== 'playing' && globalState.status !== 'meeting') return;

            const camX = canvas.width / 2 - me.x;
            const camY = canvas.height / 2 - me.y;

            ctx.save();
            ctx.translate(camX, camY);

            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= MAP_SIZE; i += 100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, MAP_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(MAP_SIZE, i); ctx.stroke();
            }

            Object.entries(players).forEach(([id, p]) => {
                ctx.globalAlpha = p.isAlive ? 1.0 : 0.3;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (me.role === 'alien' && p.role === 'alien' && id !== userId) {
                    ctx.fillStyle = 'red';
                    ctx.font = '20px sans-serif';
                    ctx.fillText('👾', p.x - 10, p.y + 8);
                }

                ctx.globalAlpha = 1.0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px "M PLUS Rounded 1c", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name + (p.isAlive ? '' : ' 💀'), p.x, p.y - 30);
            });

            ctx.restore();
            
            if (!me.isAlive && globalState.status === 'playing') {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('あなたはつかまりました...', canvas.width/2, 50);
            }
        }

        initGame();
    </script>
