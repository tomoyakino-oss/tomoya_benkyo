<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顧客提案用 2D/3D レイアウトシミュレーター</title>
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: #f5f5f5; }
  
  /* ヘッダー・ツールバー */
  #toolbar { padding: 10px 20px; background: #2c3e50; color: white; display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
  .btn { padding: 8px 12px; cursor: pointer; border: none; background: #34495e; color: white; border-radius: 4px; font-weight: bold; transition: 0.2s; }
  .btn:hover { background: #465c71; }
  .btn.active { background: #e67e22; color: #fff; }
  #viewBtn { background: #2980b9; font-size: 1.1em; padding: 8px 20px; }
  #viewBtn:hover { background: #3498db; }
  
  /* メインレイアウト */
  #main { display: flex; flex: 1; position: relative; overflow: hidden; }
  
  /* 2D ワークスペース */
  #workspace-2d { flex: 1; display: flex; flex-direction: column; position: relative; }
  #canvas-container { flex: 1; overflow: auto; position: relative; background: #e0e0e0; padding: 20px; }
  #canvas2d { 
    background-color: #ffffff; 
    position: relative; 
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    transform-origin: 0 0;
  }
  
  /* グリッド背景の動的生成用 */
  .grid-bg {
    background-image: linear-gradient(#d1d1d1 1px, transparent 1px), linear-gradient(90deg, #d1d1d1 1px, transparent 1px);
  }

  /* 2Dアイテム */
  .item-2d { 
    position: absolute; 
    transform-origin: center center;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 12px; 
    color: white; 
    text-shadow: 1px 1px 0 #000;
    user-select: none; 
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.3);
    cursor: grab;
    transition: box-shadow 0.1s;
  }
  .item-2d:active { cursor: grabbing; }
  .item-2d.selected { box-shadow: inset 0 0 0 2px #e74c3c, 0 0 10px rgba(231,76,60,0.5); z-index: 100 !important; }

  /* プロパティパネル (右側) */
  #properties { width: 280px; background: white; border-left: 1px solid #ccc; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
  .prop-group { display: flex; flex-direction: column; gap: 5px; }
  .prop-group label { font-size: 13px; color: #555; font-weight: bold; }
  .prop-group input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  .panel-title { font-size: 16px; border-bottom: 2px solid #2c3e50; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
  
  /* 3D ワークスペース */
  #viewer3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; z-index: 20; }
  #backBtn { position: absolute; top: 20px; left: 20px; z-index: 21; background: #e74c3c; font-size: 1.1em; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  #backBtn:hover { background: #c0392b; }
</style>
<!-- Three.js 関連 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="toolbar">
  <button class="btn" onclick="open3D()" id="viewBtn">3Dプレゼン表示</button>
  <span style="border-left: 1px solid #555; height: 20px; margin: 0 5px;"></span>
  <span>ツール:</span>
  <button class="btn tool-btn active" onclick="setTool('select', this)">選択・移動</button>
  <button class="btn tool-btn" onclick="setTool('desk', this)">机</button>
  <button class="btn tool-btn" onclick="setTool('chair', this)">椅子</button>
  <button class="btn tool-btn" onclick="setTool('cabinet', this)">キャビネ</button>
  <button class="btn tool-btn" onclick="setTool('conveyor', this)">コンベア</button>
  <button class="btn tool-btn" onclick="setTool('pipe', this)">配管</button>
  <button class="btn tool-btn" onclick="setTool('wall', this)">壁</button>
</div>

<div id="main">
  <!-- 2D エリア -->
  <div id="workspace-2d">
    <div id="canvas-container">
      <!-- 仮想空間サイズ 10m x 10m (1cm = 1pxとして 1000x1000) -->
      <div id="canvas2d" class="grid-bg" style="width: 1000px; height: 1000px;" onmousedown="handleCanvasClick(event)"></div>
    </div>
  </div>

  <!-- プロパティパネル -->
  <div id="properties">
    <div class="panel-title">環境設定</div>
    <div class="prop-group">
      <label>グリッド間隔 (mm)</label>
      <input type="number" id="gridSize" value="1000" onchange="updateGrid()">
    </div>
    <div class="prop-group" style="flex-direction: row; align-items: center; gap: 10px;">
      <input type="checkbox" id="snapToGrid" checked style="width:auto;">
      <label for="snapToGrid">グリッドにスナップ</label>
    </div>
    
    <div style="height: 20px;"></div>
    
    <div class="panel-title">選択アイテム寸法・調整</div>
    <div id="item-props" style="display: none; flex-direction: column; gap: 10px;">
      <div class="prop-group">
        <label>幅 (W) mm</label>
        <input type="number" id="propW" onchange="updateSelectedItem()">
      </div>
      <div class="prop-group">
        <label>奥行 (D) mm</label>
        <input type="number" id="propD" onchange="updateSelectedItem()">
      </div>
      <div class="prop-group">
        <label>高さ (H) mm</label>
        <input type="number" id="propH" onchange="updateSelectedItem()">
      </div>
      <div class="prop-group">
        <label>回転角 (度)</label>
        <input type="number" id="propRot" value="0" step="15" onchange="updateSelectedItem()">
      </div>
      <button class="btn" style="background:#e74c3c; margin-top: 10px;" onclick="deleteSelectedItem()">削除</button>
    </div>
    <div id="no-select-msg" style="font-size: 13px; color: #777;">
      アイテムを選択すると寸法や回転角を調整できます。
    </div>
  </div>

  <!-- 3D エリア -->
  <div id="viewer3d">
    <button class="btn" id="backBtn" onclick="close3D()">◀ 2D図面に戻る</button>
    <div id="canvas3d" style="width: 100%; height: 100%;"></div>
  </div>
</div>

<script>
// --- 状態管理 ---
// 表示縮尺: 現実の1mm = 0.1px (例: 1000mm = 100px)
const SCALE = 0.1; 
let items = [];
let itemIdCounter = 0;
let currentTool = 'select';
let selectedItemId = null;
let isDragging = false;
let dragOffset = { x: 0, y: 0 };

// 初期定義 (単位: mm)
const itemDefs = {
  desk: { w: 1200, d: 700, h: 700, color: '#b87333', label: '机' },
  chair: { w: 500, d: 500, h: 900, color: '#34495e', label: '椅子' },
  cabinet: { w: 900, d: 450, h: 1800, color: '#95a5a6', label: '棚' },
  conveyor: { w: 3000, d: 600, h: 800, color: '#27ae60', label: 'コンベア' },
  pipe: { w: 2000, d: 200, h: 200, color: '#2980b9', label: '配管' },
  wall: { w: 3000, d: 150, h: 2500, color: '#ecf0f1', label: '壁' }
};

// --- 初期化 ---
window.onload = () => {
  updateGrid();
};

function setTool(tool, btn) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(tool !== 'select') deselectAll();
}

function updateGrid() {
  const gridSizeMm = parseInt(document.getElementById('gridSize').value) || 1000;
  const pxSize = gridSizeMm * SCALE;
  const canvas = document.getElementById('canvas2d');
  canvas.style.backgroundSize = `${pxSize}px ${pxSize}px`;
}

// --- 2D キャンバスインタラクション ---
function handleCanvasClick(e) {
  if (currentTool === 'select' || e.target !== document.getElementById('canvas2d')) return;
  
  // 新規配置
  const rect = document.getElementById('canvas2d').getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;
  
  // スナップ処理
  if(document.getElementById('snapToGrid').checked) {
    const gridPx = (parseInt(document.getElementById('gridSize').value) || 1000) * SCALE;
    x = Math.round(x / gridPx) * gridPx;
    y = Math.round(y / gridPx) * gridPx;
  }

  const def = itemDefs[currentTool];
  const newItem = {
    id: itemIdCounter++,
    type: currentTool,
    x: x, 
    y: y,
    w: def.w, d: def.d, h: def.h,
    rot: 0,
    color: def.color,
    label: def.label
  };
  
  items.push(newItem);
  render2DItem(newItem);
  selectItem(newItem.id);
  
  // 配置後は自動で選択モードに戻す（連続配置を防ぎ操作性を上げる）
  setTool('select', document.querySelector('.tool-btn'));
}

function render2DItem(item) {
  let div = document.getElementById(`item-${item.id}`);
  if (!div) {
    div = document.createElement('div');
    div.id = `item-${item.id}`;
    div.className = 'item-2d';
    div.innerText = item.label;
    
    // ドラッグイベント登録
    div.onmousedown = (e) => startDrag(e, item.id);
    document.getElementById('canvas2d').appendChild(div);
  }
  
  const wPx = item.w * SCALE;
  const dPx = item.d * SCALE;
  
  div.style.width = wPx + 'px';
  div.style.height = dPx + 'px';
  div.style.backgroundColor = item.color;
  // 中心基準で配置し、回転を適用
  div.style.left = (item.x - wPx/2) + 'px';
  div.style.top = (item.y - dPx/2) + 'px';
  div.style.transform = `rotate(${item.rot}deg)`;
}

// --- ドラッグ＆ドロップ ---
function startDrag(e, id) {
  if(currentTool !== 'select') return;
  e.stopPropagation(); // キャンバスクリック発火を防ぐ
  
  selectItem(id);
  const item = items.find(i => i.id === id);
  const rect = document.getElementById('canvas2d').getBoundingClientRect();
  
  isDragging = true;
  dragOffset.x = (e.clientX - rect.left) - item.x;
  dragOffset.y = (e.clientY - rect.top) - item.y;
  
  document.onmousemove = drag;
  document.onmouseup = endDrag;
}

function drag(e) {
  if (!isDragging) return;
  const rect = document.getElementById('canvas2d').getBoundingClientRect();
  let newX = (e.clientX - rect.left) - dragOffset.x;
  let newY = (e.clientY - rect.top) - dragOffset.y;
  
  if(document.getElementById('snapToGrid').checked) {
    const gridPx = (parseInt(document.getElementById('gridSize').value) || 1000) * SCALE;
    newX = Math.round(newX / gridPx) * gridPx;
    newY = Math.round(newY / gridPx) * gridPx;
  }
  
  const item = items.find(i => i.id === selectedItemId);
  item.x = newX;
  item.y = newY;
  render2DItem(item);
}

function endDrag() {
  isDragging = false;
  document.onmousemove = null;
  document.onmouseup = null;
}

// --- 選択・プロパティ変更 ---
function selectItem(id) {
  deselectAll();
  selectedItemId = id;
  const div = document.getElementById(`item-${id}`);
  if(div) div.classList.add('selected');
  
  const item = items.find(i => i.id === id);
  if(item) {
    document.getElementById('item-props').style.display = 'flex';
    document.getElementById('no-select-msg').style.display = 'none';
    document.getElementById('propW').value = item.w;
    document.getElementById('propD').value = item.d;
    document.getElementById('propH').value = item.h;
    document.getElementById('propRot').value = item.rot;
  }
}

function deselectAll() {
  selectedItemId = null;
  document.querySelectorAll('.item-2d').forEach(el => el.classList.remove('selected'));
  document.getElementById('item-props').style.display = 'none';
  document.getElementById('no-select-msg').style.display = 'block';
}

function updateSelectedItem() {
  if (selectedItemId === null) return;
  const item = items.find(i => i.id === selectedItemId);
  item.w = parseFloat(document.getElementById('propW').value);
  item.d = parseFloat(document.getElementById('propD').value);
  item.h = parseFloat(document.getElementById('propH').value);
  item.rot = parseFloat(document.getElementById('propRot').value);
  render2DItem(item);
}

function deleteSelectedItem() {
  if (selectedItemId === null) return;
  items = items.filter(i => i.id !== selectedItemId);
  const div = document.getElementById(`item-${selectedItemId}`);
  if(div) div.remove();
  deselectAll();
}

// --- 3D モード (高機能版) ---
let scene, camera, renderer, controls, animationId;

function open3D() {
  document.getElementById('viewer3d').style.display = 'block';
  init3D();
}

function close3D() {
  document.getElementById('viewer3d').style.display = 'none';
  cancelAnimationFrame(animationId);
}

function init3D() {
  const container = document.getElementById('canvas3d');
  container.innerHTML = '';
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);
  
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  camera = new THREE.PerspectiveCamera(50, width / height, 100, 20000);
  camera.position.set(0, 3000, 4000);
  
  // シャドウマップ有効化で質感を向上
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(width, height);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);
  
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  // ライティング (環境光 + 影を落とす平行光源)
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(2000, 4000, 2000);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.left = -5000;
  dirLight.shadow.camera.right = 5000;
  dirLight.shadow.camera.top = 5000;
  dirLight.shadow.camera.bottom = -5000;
  scene.add(dirLight);

  // 床
  const floorGeo = new THREE.PlaneGeometry(10000, 10000);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  
  // グリッド
  const grid = new THREE.GridHelper(10000, 10, 0x000000, 0x444444);
  grid.position.y = 1;
  scene.add(grid);
  
  // アイテムの立体化 (プロシージャル生成で形状と質感を再現)
  items.forEach(item => {
    // 2Dキャンバス中心(500,500)を3D原点(0,0,0)にマッピングし、実寸(mm)にスケール
    const posX = (item.x / SCALE) - 5000;
    const posZ = (item.y / SCALE) - 5000;
    
    // アイテムごとのグループを作成
    const group = new THREE.Group();
    group.position.set(posX, 0, posZ);
    // 2Dの回転角(時計回り)をThree.jsのY軸回転(反時計回り)に変換
    group.rotation.y = -item.rot * (Math.PI / 180);
    
    // ベースとなるマテリアル (StandardMaterialで光の反射を計算)
    const baseMat = new THREE.MeshStandardMaterial({ 
      color: item.color, 
      roughness: 0.6, 
      metalness: 0.1 
    });

    if (item.type === 'desk') {
      // 天板
      const topGeo = new THREE.BoxGeometry(item.w, 30, item.d);
      const top = new THREE.Mesh(topGeo, baseMat);
      top.position.y = item.h - 15;
      top.castShadow = true;
      group.add(top);
      // 脚4本
      const legGeo = new THREE.CylinderGeometry(20, 20, item.h - 30);
      const legMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
      const positions = [
        [-item.w/2 + 50, item.d/2 - 50], [item.w/2 - 50, item.d/2 - 50],
        [-item.w/2 + 50, -item.d/2 + 50], [item.w/2 - 50, -item.d/2 + 50]
      ];
      positions.forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(pos[0], (item.h-30)/2, pos[1]);
        leg.castShadow = true;
        group.add(leg);
      });
    } 
    else if (item.type === 'conveyor') {
      // 脚部ベース
      const baseGeo = new THREE.BoxGeometry(item.w, item.h - 100, item.d - 100);
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.y = (item.h - 100) / 2;
      baseMesh.castShadow = true;
      group.add(baseMesh);
      // ベルト部分 (黒いゴムの質感)
      const beltGeo = new THREE.BoxGeometry(item.w, 100, item.d);
      const beltMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
      const belt = new THREE.Mesh(beltGeo, beltMat);
      belt.position.y = item.h - 50;
      belt.castShadow = true;
      group.add(belt);
    }
    else if (item.type === 'pipe') {
      // 円柱配管 (金属光沢を持たせる)
      const pipeGeo = new THREE.CylinderGeometry(item.d/2, item.d/2, item.w, 32);
      const pipeMat = new THREE.MeshStandardMaterial({ color: item.color, metalness: 0.7, roughness: 0.3 });
      const pipe = new THREE.Mesh(pipeGeo, pipeMat);
      pipe.rotation.z = Math.PI / 2;
      pipe.position.y = item.h / 2; // 地上高
      pipe.castShadow = true;
      group.add(pipe);
    }
    else {
      // その他 (壁、キャビネット等)はシンプルな直方体
      const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
      const mesh = new THREE.Mesh(geo, baseMat);
      mesh.position.y = item.h / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      
      // エッジを強調して見やすくする
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
      mesh.add(line);
      
      group.add(mesh);
    }
    
    scene.add(group);
  });

  animate();
}

function animate() {
  if(document.getElementById('viewer3d').style.display === 'none') return;
  animationId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// リサイズ対応
window.addEventListener('resize', () => {
  if(camera && renderer) {
    const container = document.getElementById('canvas3d');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }
});
</script>
</body>
</html>
